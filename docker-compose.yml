version: '3.8'

# Chạy file này bằng lệnh: docker-compose up -d

services:
  # FastAPI backend
  app:
    build: .
    container_name: su-viet-rag-api
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - mongodb
      - qdrant
    networks:
      - su-viet-rag-net

  # Reverse proxy (no SSL, handled by Cloudflare tunnel)
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: su-viet-rag-proxy
    depends_on:
      - app
    ports:
      - "8083:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      # Nếu muốn phục vụ UI tĩnh, mount thư mục UI vào nginx
      - ./ui:/usr/share/nginx/html:ro
    networks:
      - su-viet-rag-net

  # Service cho MongoDB
  mongodb:
    image: mongo:latest
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - mongo_data:/data/db
    networks:
      - su-viet-rag-net

  # Service cho Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - su-viet-rag-net

# Định nghĩa volumes để lưu trữ dữ liệu
volumes:
  mongo_data:
  qdrant_data:

# Định nghĩa network để các container có thể giao tiếp với nhau qua tên service
networks:
  su-viet-rag-net:
    driver: bridge
