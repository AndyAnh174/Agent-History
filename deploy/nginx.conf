worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    include       mime.types;
    default_type  application/octet-stream;

    upstream suviet_backend {
        server app:8000;
    }

    server {
        listen 80;
        server_name _;

        # Serve static UI files (mounted at /usr/share/nginx/html)
        root /usr/share/nginx/html;
        index index.html;

        # Try to serve static assets first, then proxy to backend
        location / {
            try_files $uri $uri/ @backend;
        }

        location @backend {
            proxy_pass http://suviet_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Optionally expose API under /api without trying static files
        location /api/ {
            proxy_pass http://suviet_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health checks or other prefetched endpoints
        location /health {
            proxy_pass http://suviet_backend/health;
        }
    }
}

